<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>英语闯关台 LexiQuest · 高保真原型 v2.0.5</title>
<!-- 设计令牌单一来源：与 app/globals.css 同步，禁止在各原型内联重复定义 -->
<link rel="stylesheet" href="tokens.css" />
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background 0.25s ease, color 0.25s ease;
}
button { font-family: inherit; cursor: pointer; }
.app { max-width: 1080px; margin: 0 auto; padding: 16px 16px 96px; }

/* ===== Header ===== */
.hd {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  background: color-mix(in srgb, var(--bg-soft) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow); margin-bottom: 16px;
}
.hd .logo {
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(135deg, var(--primary), #8b5cf6);
  display: grid; place-items: center; color: #fff; flex: none;
}
.hd .ttl { font-weight: 700; font-size: 16px; line-height: 1.1; }
.hd .sub { font-size: 11px; color: var(--text-faint); }
.hd .spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--bg-sunken); color: var(--text-soft);
  border: 1px solid var(--border); white-space: nowrap; transition: transform 0.12s;
}
.chip:active { transform: scale(0.95); }
.chip.pts { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.chip.flame { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--bg-sunken); color: var(--text-soft);
  display: grid; place-items: center; transition: transform 0.12s, background 0.2s;
}
.iconbtn:hover { background: var(--primary-soft); color: var(--primary); }
.iconbtn:active { transform: scale(0.95); }

/* ===== Cards / generic ===== */
.card {
  background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px;
}
.card h2 { margin: 0 0 4px; font-size: 15px; }
.card .hint { color: var(--text-faint); font-size: 12px; margin-bottom: 12px; }
.section-title {
  display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700;
  margin: 18px 4px 10px; color: var(--text);
}
.section-title svg { color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--bg-sunken); color: var(--text); font-size: 14px; font-weight: 600; min-height: 44px;
  transition: transform 0.12s, background 0.2s;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--primary); color: var(--primary-text); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.btn.sm { padding: 7px 12px; min-height: 38px; font-size: 13px; }

/* ===== Group selector ===== */
.group-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px; }
.group-card {
  text-align: left; border: 1px solid var(--border); background: var(--bg-soft);
  border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
  transition: transform 0.15s ease, border-color 0.15s ease;
  display: flex; flex-direction: column; gap: 8px;
}
.group-card:hover { transform: translateY(-3px); border-color: var(--primary); }
.group-card .emoji {
  width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; color: #fff; font-size: 22px;
}
.group-card .title { margin: 4px 0 0; font-size: 16px; }
.group-card .desc { margin: 0; font-size: 12px; color: var(--text-faint); line-height: 1.5; }
.group-card .range { font-size: 11px; font-weight: 700; color: var(--text-soft); }

/* ===== Today panel ===== */
.today {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-soft); box-shadow: var(--shadow); padding: 16px;
}
.today .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
.today .head .date { margin-left: auto; font-size: 12px; color: var(--text-faint); font-weight: 500; }
.today .row {
  display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--border);
}
.today .row:last-child { border-bottom: none; }
.today .word { font-weight: 600; }
.today .meta { font-size: 12px; color: var(--text-faint); }
.today .overdue {
  color: var(--danger); font-size: 11px; font-weight: 700; background: var(--danger-soft);
  padding: 2px 7px; border-radius: 6px;
}
.today .done .word { text-decoration: line-through; color: var(--text-faint); }
.check {
  width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border);
  background: transparent; display: grid; place-items: center; flex: none; color: #fff; transition: all 0.15s;
}
.check.on { background: var(--success); border-color: var(--success); }

/* ===== Tabs ===== */
.tabs {
  display: flex; gap: 8px; margin: 16px 0;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 14px; padding: 6px; box-shadow: var(--shadow);
}
.tabs button {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px; border-radius: 10px; border: none; background: transparent; color: var(--text-soft);
  font-size: 14px; font-weight: 600; min-height: 44px; transition: background 0.2s, color 0.2s;
}
.tabs button.active { background: var(--primary); color: var(--primary-text); }

/* ===== Word flip cards ===== */
.flip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.flip { perspective: 1200px; min-height: 200px; }
.flip-inner {
  position: relative; width: 100%; min-height: 200px; transition: transform 0.5s;
  transform-style: preserve-3d;
}
.flip.open .flip-inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-soft);
  box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column;
}
.face.back { transform: rotateY(180deg); background: var(--primary-soft); }
.face .word { font-size: 22px; font-weight: 700; }
.face .phon { color: var(--text-faint); font-size: 13px; margin-top: 2px; }
.face .pos {
  display: inline-block; margin-top: 8px; font-size: 11px; color: var(--primary);
  background: var(--primary-soft); padding: 2px 8px; border-radius: 6px; align-self: flex-start;
}
.face .meaning { font-size: 16px; margin-top: auto; font-weight: 600; }
.face .ex { font-size: 12px; color: var(--text-soft); margin-top: 6px; line-height: 1.5; }
.face .ex b { color: var(--text); }
.parts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.part { border-radius: 9px; padding: 6px 10px; font-size: 13px; color: #fff; font-weight: 600; cursor: help; }
.part.prefix { background: var(--prefix); }
.part.root { background: var(--root); }
.part.suffix { background: var(--suffix); }
.part.base { background: var(--base); }
.part-hint { font-size: 11px; color: var(--text-soft); width: 100%; margin-top: -2px; }
.flip .flipbtn { position: absolute; right: 12px; bottom: 12px; z-index: 2; }
.speak {
  width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg-sunken); color: var(--text-soft); display: grid; place-items: center;
}

/* ===== Formation practice ===== */
.quiz {
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-soft);
  box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px;
}
.quiz .q { font-weight: 600; margin-bottom: 4px; }
.quiz .root { font-size: 12px; color: var(--text-faint); margin-bottom: 12px; }
.opt {
  display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--bg-sunken); margin-bottom: 8px; font-size: 15px; min-height: 44px;
  transition: border-color 0.15s, background 0.15s;
}
.opt.sel { border-color: var(--primary); background: var(--primary-soft); }
.opt.right { border-color: var(--success); background: var(--success-soft); color: var(--success); }
.opt.wrong { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
.opt .box {
  width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border); flex: none;
  display: grid; place-items: center; color: #fff;
}
.opt.sel .box, .opt.right .box, .opt.wrong .box { border-color: currentColor; background: currentColor; }
.opt .box svg { color: var(--bg-soft); }
.exp {
  margin-top: 10px; font-size: 13px; color: var(--text-soft); background: var(--bg-sunken);
  border-radius: 10px; padding: 10px 12px; line-height: 1.5;
}
.exp b { color: var(--text); }

/* ===== Challenge ===== */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
.stat {
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-soft);
  box-shadow: var(--shadow); padding: 14px; text-align: center;
}
.stat .n { font-size: 24px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
.lvl-bar {
  height: 12px; border-radius: 999px; background: var(--bg-sunken); overflow: hidden; margin: 10px 0 4px;
}
.lvl-bar > i {
  display: block; height: 100%; background: linear-gradient(90deg, var(--primary), #8b5cf6);
  border-radius: 999px; transition: width 0.6s cubic-bezier(.2,.8,.2,1);
}
.lvl-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.lvl {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--bg-soft);
}
.lvl .badge {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  background: var(--bg-sunken); color: var(--text-soft); flex: none; font-weight: 800;
}
.lvl.done .badge { background: var(--success-soft); color: var(--success); }
.lvl .info { flex: 1; }
.lvl .info .t { font-weight: 600; font-size: 14px; }
.lvl .info .d { font-size: 12px; color: var(--text-faint); }
.tag {
  display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px;
  background: var(--bg-sunken); color: var(--text-soft); margin-right: 6px; margin-top: 4px;
}
.empty { text-align: center; color: var(--text-faint); padding: 30px 10px; font-size: 14px; }

/* ===== Settings drawer ===== */
.overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 50;
  display: flex; justify-content: flex-end; animation: fade 0.2s ease;
}
@keyframes fade { from { opacity: 0; } }
.drawer {
  width: min(420px, 100%); height: 100%; background: var(--bg); padding: 20px;
  overflow-y: auto; animation: slidein 0.2s ease; box-shadow: var(--shadow-lg);
}
@keyframes slidein { from { transform: translateX(30px); opacity: 0.6; } }
.drawer h2 { margin: 0 0 14px; font-size: 18px; }
.drawer .close { position: absolute; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-soft); }
.field input[type="text"], .field input[type="password"] {
  width: 100%; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--bg-soft); color: var(--text); font-size: 16px;
}
.field .note { font-size: 12px; color: var(--text-faint); margin-top: 6px; line-height: 1.5; }
.sync-state {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
  padding: 5px 10px; border-radius: 999px;
}
.sync-state.local { background: var(--bg-sunken); color: var(--text-soft); }
.sync-state.syncing { background: var(--warn-soft); color: var(--warn); }
.sync-state.synced { background: var(--success-soft); color: var(--success); }
.sync-state.offline { background: var(--danger-soft); color: var(--danger); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

/* switch */
.switch { position: relative; width: 46px; height: 26px; flex: none; }
.switch input { display: none; }
.switch .track {
  position: absolute; inset: 0; border-radius: 999px; background: var(--bg-sunken);
  border: 1px solid var(--border); transition: background 0.2s;
}
.switch .knob {
  position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; box-shadow: var(--shadow); transition: transform 0.2s;
}
.switch input:checked + .track { background: var(--primary); }
.switch input:checked + .track + .knob { transform: translateX(20px); }

/* ===== Bottom nav ===== */
.bottomnav { display: none; }

/* ===== Toast ===== */
.toast {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
  font-size: 13px; font-weight: 600; z-index: 70; box-shadow: var(--shadow-lg);
  animation: pop 0.2s ease;
}
@keyframes pop { from { transform: translateX(-50%) scale(0.9); opacity: 0.5; } }

.view { animation: viewin 0.25s ease; }
@keyframes viewin { from { opacity: 0; transform: translateY(8px); } }

/* ===== Responsive ===== */
@media (max-width: 760px) {
  .app { padding: 12px 12px 92px; }
  .group-grid { grid-template-columns: 1fr; }
  .tabs { display: none; }
  .bottomnav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg-soft) 94%, transparent); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); gap: 6px;
  }
  .bottomnav button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 4px; border: none; background: transparent; color: var(--text-faint);
    font-size: 11px; font-weight: 600;
  }
  .bottomnav button.active { color: var(--primary); }
  .hd .sub { display: none; }
  }

/* ===== 愉悦微交互（与 app 生产代码对齐；reduced-motion 由 tokens.css 全局归零） ===== */
.btn { position: relative; overflow: hidden; }
.btn::after {
  content: ""; position: absolute; top: 0; left: -120%; width: 60%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,.45), transparent);
  transform: skewX(-20deg); transition: left .5s;
}
.btn.primary:hover::after { left: 130%; }
@keyframes popin { 0%{transform:scale(.9)} 60%{transform:scale(1.06)} 100%{transform:scale(1)} }
.check.on { animation: popin .25s ease; }
.opt.right { animation: popin .25s ease; }
.opt.wrong { animation: shake .3s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.chip.flame:hover svg { animation: wiggle .6s ease; transform-origin: 70% 80%; }
@keyframes wiggle { 0%,100%{transform:rotate(0)} 30%{transform:rotate(-12deg)} 60%{transform:rotate(10deg)} }
.flip.open .flip-inner { animation: popin .3s ease; }
.lvl.done .badge { animation: badgepulse 1.6s ease infinite; }
@keyframes badgepulse { 0%,100%{box-shadow:0 0 0 0 rgba(21,128,58,.4)} 50%{box-shadow:0 0 0 6px rgba(21,128,58,0)} }
.lvl-bar > i { position: relative; overflow: hidden; }
.lvl-bar > i::after {
  content: ""; position: absolute; inset: 0; left: -100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
  animation: shimmer 2.2s linear infinite;
}
@keyframes shimmer { to { left: 100%; } }
.hd .logo { cursor: pointer; transition: transform .2s; }
.hd .logo:hover { transform: translateY(-3px) rotate(-4deg); }

/* 庆祝层（纯装饰，aria-hidden；reduced-motion 下被 tokens.css 全局规则归零） */
.celebration-layer { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.celebrate-emoji {
  position: absolute; font-size: 22px; will-change: transform, opacity;
  animation: cel-float var(--dur,1.3s) cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes cel-float {
  0% { transform: translate(-50%,-50%) scale(.4); opacity: 0; }
  18% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
  100% { transform: translate(calc(-50% + var(--dx,0px)), calc(-50% - 90px)) scale(.9); opacity: 0; }
}
</style>
</head>
<body>
<div id="lexiquest-app" class="app">
  <!-- 动态内容由 JS 渲染 -->
</div>
<div class="celebration-layer" aria-hidden="true"></div>

<script>
/* ====== 真实数据（节选自 lib/words.ts） ====== */
const WORDS = [

  { id:"ad-transform", group:"adult", word:"transform", phonetic:"/trænsˈfɔːrm/", pos:"v. 动词", meaning:"使改变，转化",
    parts:[{text:"trans-",type:"prefix",hint:"跨越（across）"},{text:"form",type:"root",hint:"形、形式"}],
    example:{en:"The plan will transform our city.",zh:"这个计划将改变我们的城市。"}, tags:["职场"] },
  { id:"ad-perspective", group:"adult", word:"perspective", phonetic:"/pərˈspektɪv/", pos:"n. 名词", meaning:"视角，观点",

function readableTextOn(hex) {
  const c = hex.replace('#', '').trim();
  const full = c.length === 3 ? c.split('').map(x => x + x).join('') : c.slice(0, 6);
  const r = parseInt(full.slice(0, 2), 16) / 255, g = parseInt(full.slice(2, 4), 16) / 255, b = parseInt(full.slice(4, 6), 16) / 255;
  const lin = v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  const cw = (1.0 + 0.05) / (L + 0.05), cb = (L + 0.05) / 0.05;
  return cw >= cb ? '#ffffff' : '#0f1320';
}

/* 庆祝层：纯装饰 emoji 迸发（aria-hidden；reduced-motion 下被 tokens.css 全局规则归零） */
const CELE_POOL = ["🎉","✨","⭐","🌟","💫","🏆","🔥","💡","📚","🚀","🧠"];
function centerOf(el){ const r = el.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; }
function levelForPoints(p){ let lv = 1; for (const l of LEVELS) if (p >= l.need) lv = l.lv; return lv; }
function fireCelebrate(x, y, count, emojis){
  const layer = document.querySelector(".celebration-layer");
  if (!layer) return;
  const pool = (emojis && emojis.length) ? emojis : CELE_POOL;
  const n = Math.min(Math.max(count || 14, 1), 40);
  for (let i = 0; i < n; i++){
    const s = document.createElement("span");
    s.className = "celebrate-emoji";
    s.textContent = pool[Math.floor(Math.random() * pool.length)];
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", (Math.random()*160 - 80) + "px");
    s.style.setProperty("--dur", (0.9 + Math.random()*0.6) + "s");
    layer.appendChild(s);
    setTimeout(() => s.remove(), 1700);
  }
}
function todayStr(){
  const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

/* 数字滚动动画：从 0 滚到目标值（尊重 reduced-motion） */
function animateCount(el, to){
  if (!el) return;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { el.textContent = to; return; }
  const dur = 600, start = performance.now();
  function step(now){
    const p = Math.min(1, (now-start)/dur);
    el.textContent = Math.round(to * (1 - Math.pow(1-p, 3)));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

    <div class="card" style="margin-top:14px">
      <h2>全部词库（${bank.length} 词）</h2>
      <div class="hint">本年龄段可学的全部单词，坚持每天打卡解锁更多</div>
      <div>${bank.map(w=>`<span class="tag">${w.word}</span>`).join("")}</div>
    </div>`;
}

function renderDrawer(){
  const ss = state.syncState;
  const ssText = { local:"本地模式", syncing:"同步中…", synced:"已同步", offline:"离线" }[ss];
  return `
  <div class="overlay" id="overlay">
    <div class="drawer" id="settings-drawer" role="dialog" aria-modal="true" aria-label="设置" data-component="SettingsDrawer.tsx">
      <div style="display:flex;align-items:center;margin-bottom:14px">
        <h2 style="margin:0">设置</h2>
        <div class="spacer" style="flex:1"></div>
        <button class="iconbtn" id="closeDrawer">${I.x}</button>
      </div>

      <div class="field" style="display:flex;align-items:center;justify-content:space-between">
        <label style="margin:0">深色模式</label>
        <label class="switch">
          <input type="checkbox" id="themeSwitch" ${state.theme==='dark'?'checked':''}>
          <span class="track"></span><span class="knob"></span>
        </label>
      </div>

      <div class="field">
        <label>云端同步</label>
        <div style="display:flex;align-items:center;gap:10px">
          <label class="switch"><input type="checkbox" id="cloudSwitch" ${state.cloudOn?'checked':''}><span class="track"></span><span class="knob"></span></label>
          <span class="sync-state ${ss}"><span class="dot"></span>${I.cloud} ${ssText}</span>
        </div>
      </div>

      <div class="field">
        <label>同步码</label>
        <input type="text" id="syncCode" value="${state.syncCode}" placeholder="例如 LEXI-2026">
        <div class="note">多设备填写相同同步码即可共享进度（Edge KV，无需登录）。</div>
      </div>

      <div class="field">
        <label>数据管理</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm" id="exportBtn">${I.book} 导出 JSON</button>
          <button class="btn sm" id="importBtn">导入 JSON</button>
          <button class="btn sm danger" id="clearBtn">清空本机</button>
        </div>
        <div class="note">导出可用于备份；清空将删除本年龄段全部进度（二次确认）。</div>
      </div>
    </div>
  </div>`;
}

/* ====== 事件绑定 ====== */
/* 仅重渲染 tab 内容，保留其它区块（翻卡/积分）状态，避免整页 render 丢失交互态 */
function renderTab(){
  const tc = document.getElementById("tab-content");
  if (!tc) return;
  const bank = WORDS.filter(w=>w.group===state.group);
  const todayWords = bank.slice(0, 5);
  tc.innerHTML = state.tab==='words'? renderWords(todayWords) : state.tab==='formation'? renderFormation() : renderChallenge(bank);
  // 更新 tab 选中态（不重建整页）
  document.querySelectorAll("[data-tab]").forEach(b=>{
    const on = b.dataset.tab===state.tab;
    b.classList.toggle("active", on);
    if (b.getAttribute("role")==="tab") b.setAttribute("aria-selected", on);
  });
  bindLocal(); // 重新绑定局部交互
}
/* 局部刷新顶部积分（不整页 render） */
function updatePoints(){
  const pc = document.getElementById("ptsCount"), sc = document.getElementById("streakCount");
  if (pc) animateCount(pc, state.points);
  if (sc) animateCount(sc, state.streak);
}

function bind(){
  // 顶部 Logo 点击 / 键盘 → 全屏庆祝彩蛋（纯装饰，aria-hidden）
  document.querySelectorAll('.hd .logo').forEach(l=>{
    const go = ()=> fireCelebrate(...centerOf(l), 16, CELE_POOL);
    l.onclick = go;
    l.onkeydown = (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } };
  });
  // 选人群
  document.querySelectorAll(".group-card").forEach(b=>{
    b.onclick = ()=>{ state.group = b.dataset.group; state.tab="words"; render(); toast(`已选择 ${GROUP_META[state.group].name}`); };
  });
  // 切换人群
  const sg = document.getElementById("switchGroup");
  if (sg) sg.onclick = ()=>{ state.group=null; render(); };
  // 主题
  const tb = document.getElementById("themeBtn");
  if (tb) tb.onclick = ()=>{ state.theme = state.theme==='dark'?'light':'dark'; render(); };
  // 标签（局部重渲染 tab 内容，保留翻卡/积分状态）
  document.querySelectorAll("[data-tab]").forEach(b=>{
    b.onclick = ()=>{ state.tab = b.dataset.tab; renderTab(); };
  });
  bindLocal();
  // 设置抽屉
  const sb = document.getElementById("settingsBtn");
  if (sb) sb.onclick = ()=> openDrawer();
  const tb2 = document.getElementById("themeBtn");
  if (tb2) tb2.onclick = ()=>{ state.theme = state.theme==='dark'?'light':'dark'; document.documentElement.classList.toggle("dark", state.theme==='dark'); tb2.innerHTML = state.theme==='dark'?I.sun:I.moon; };
  // 已绑定的局部交互委托到 bindLocal
}

/* 局部交互（翻卡/朗读/勾选/组词/抽屉内部），每次局部重渲染后重绑 */
function bindLocal(){
  // 翻转卡：局部切换，保留状态；键盘可操作
  document.querySelectorAll(".flip").forEach(f=>{
    const toggle = ()=>{ if(f.querySelector(".speak") && f.querySelector(".speak").contains(document.activeElement)) return; const open=f.classList.toggle("open"); f.setAttribute("aria-pressed", open); };
    f.onclick = (e)=>{ if(e.target.closest(".speak")) return; toggle(); };
    f.onkeydown = (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } };
  });
  // 朗读
  document.querySelectorAll("[data-speak]").forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); speak(b.dataset.speak); };
  });
  // 今日完成勾选（局部更新该行 + 顶部积分，不整页 render）
  document.querySelectorAll(".check[data-word]").forEach(c=>{
    c.onclick = ()=>{
      const id = c.dataset.word;
      const row = c.closest(".row");
      if (state.doneWords.has(id)) {
        state.doneWords.delete(id); state.points = Math.max(0, state.points-10);
        c.classList.remove("on"); c.innerHTML=""; row.classList.remove("done"); toast("已取消 -10 分");
      } else {
        const beforeLv = levelForPoints(state.points);
        state.doneWords.add(id); state.points += 10;
        c.classList.add("on"); c.innerHTML=I.check; row.classList.add("done"); toast("已完成 +10 分");
        fireCelebrate(...centerOf(c), 8, ["🎉","✨","⭐","💡"]);
        if (levelForPoints(state.points) > beforeLv) fireCelebrate(window.innerWidth/2, 110, 24, ["🎉","🏆","⭐","🌟","✨","🚀","💫"]);
      }
      updatePoints();
    };
  });
  // 组词练习
  document.querySelectorAll(".opt").forEach(o=>{
    o.onclick = ()=>{ if(o.parentElement.querySelector(".submit").disabled) return; const sel=o.classList.toggle("sel"); o.setAttribute("aria-checked", sel); };
    o.onkeydown = (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); o.click(); } };
  });
  document.querySelectorAll(".submit").forEach(btn=>{
    btn.onclick = ()=>{
      if (btn.disabled) return;
      const qid = btn.dataset.q;
      const f = FORMATION.find(x=>x.id===qid) || FORMATION[0];
      const quiz = btn.closest(".quiz");
      const opts = [...quiz.querySelectorAll(".opt")];
      const sel = opts.filter(o=>o.classList.contains("sel")).map(o=>+o.dataset.i).sort();
      const ans = [...f.answers].sort();
      const correct = sel.length===ans.length && sel.every((v,i)=>v===ans[i]);
      opts.forEach(o=>{
        const i = +o.dataset.i;
        if (f.answers.includes(i)) o.classList.add("right");
        else if (o.classList.contains("sel")) o.classList.add("wrong");
        o.setAttribute("aria-checked", "false"); o.classList.remove("sel");
      });
      btn.disabled = true;
      const exp = quiz.querySelector(".exp");
      exp.style.display="block";
      exp.innerHTML = `<b>${correct?'答对了 🎉':'解析：'}</b> ${f.explanation}`;
      if (correct && !state.formationDone.has(qid)) {
        const beforeLv = levelForPoints(state.points);
        state.formationDone.add(qid); state.points += 20; toast("组词完成 +20 分");
        fireCelebrate(...centerOf(btn), 16, ["🎉","🏆","✨","💡","🧠"]);
        if (levelForPoints(state.points) > beforeLv) fireCelebrate(window.innerWidth/2, 110, 24, ["🎉","🏆","⭐","🌟","✨","🚀","💫"]);
        updatePoints(); // 局部刷新积分，不整页 render 丢失翻卡状态
      }
    };
  });
  bindDrawerLocal();
}

/* ====== 抽屉：局部开关，不整页 render（保留页面状态） ====== */
let lastFocused = null;
function openDrawer(){
  if (state.settingsOpen) return;
  state.settingsOpen = true;
  lastFocused = document.activeElement;
  document.getElementById("lexiquest-app").insertAdjacentHTML("beforeend", renderDrawer());
  bindDrawerLocal();
  document.addEventListener("keydown", onDrawerKey);
  const first = document.getElementById("closeDrawer");
  if (first) first.focus();
}
function closeDrawer(){
  if (!state.settingsOpen) return;
  state.settingsOpen = false;
  const ov = document.getElementById("overlay");
  if (ov) ov.remove();
  document.removeEventListener("keydown", onDrawerKey);
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}
function onDrawerKey(e){ if(e.key==="Escape") closeDrawer(); }
function bindDrawerLocal(){
  const cd = document.getElementById("closeDrawer");
  if (cd) cd.onclick = closeDrawer;
  const ov = document.getElementById("overlay");
  if (ov) ov.onclick = (e)=>{ if(e.target.id==="overlay") closeDrawer(); };
  const ts = document.getElementById("themeSwitch");
  if (ts) ts.onchange = ()=>{ state.theme = ts.checked?'dark':'light'; document.documentElement.classList.toggle("dark", state.theme==='dark'); };
  const cs = document.getElementById("cloudSwitch");
  if (cs) cs.onchange = ()=>{ state.cloudOn=cs.checked; state.syncState = cs.checked?'synced':'local'; const ss=document.querySelector(".sync-state"); if(ss){ ss.className="sync-state "+(cs.checked?'synced':'local'); ss.innerHTML='<span class="dot"></span>'+(cs.checked?I.cloud+' 已同步':'本地模式'); } };
  const sc = document.getElementById("syncCode");
  if (sc) sc.onchange = ()=>{ state.syncCode=sc.value; };
  const eb = document.getElementById("exportBtn");
  if (eb) eb.onclick = ()=> toast("已导出 lexiquest-backup.json");
  const ib = document.getElementById("importBtn");
  if (ib) ib.onclick = ()=> toast("请选择 JSON 文件");
  const cb = document.getElementById("clearBtn");
  if (cb) cb.onclick = ()=>{ if(confirm("确定清空本机数据？此操作不可撤销。")){ toast("已清空本机数据"); } };
}

render();
</script>
